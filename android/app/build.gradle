plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anibeat.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.anibeat.app"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
        resConfigs "ru", "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Для CI собираем release как debug-подписанный, чтобы артефакт был доступен без своего keystore.
            // Для продакшна добавьте свой signingConfigs.release и укажите ANDROID_KEYSTORE_* secrets.
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources.excludes += ["META-INF/*.kotlin_module", "DebugProbesKt.bin"]
    }

    buildFeatures { viewBinding true }
}

dependencies {
    // UI — Material 3, тёмная тема, RecyclerView, ViewPager2
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.palette:palette:1.0.0'     // акцентный цвет из обложки (аналог extractColor)

    // Сеть — как в веб-версии: OkHttp + дисковый кэш + дедупликация запросов
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.12.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    // Медиа — ExoPlayer + MediaSession (управление с экрана блокировки / шторки)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // Glide — загрузка обложек (используется в TrackAdapter, PlayerActivity, Binders)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Guava — ListenableFuture / MoreExecutors для App.java (MediaController)
    implementation 'com.google.guava:guava:32.1.3-android'

    // Корутины не нужны: всё на Executor + LiveData
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.annotation:annotation:1.8.2'
}
