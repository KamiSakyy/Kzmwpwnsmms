name: Android CI

# Сборка нативного Android-приложения AniBeat (Java, Gradle, SDK 35)
# Триггеры: пуш в main/arena/*, PR в main, ручной запуск
# Исправленная версия без android-actions/setup-android (используем предустановленный SDK на ubuntu-latest)
on:
  push:
    branches: [ "main", "arena/**" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Debug + Release)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Setup Android SDK 35
        run: |
          set -e
          echo "Before: ANDROID_HOME=$ANDROID_HOME ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # На ubuntu-latest SDK уже предустановлен в $ANDROID_HOME
          # Проверим sdkmanager
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=sdkmanager
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "sdkmanager not found, searching..."
            find $ANDROID_HOME -name sdkmanager 2>/dev/null | head -5
            SDKMANAGER=$(find $ANDROID_HOME -name sdkmanager 2>/dev/null | head -1)
          fi
          echo "Using SDKMANAGER=$SDKMANAGER"
          $SDKMANAGER --version
          echo "SDK packages before:"
          $SDKMANAGER --list_installed 2>&1 | head -100 || true
          echo "Accepting licenses..."
          yes | $SDKMANAGER --licenses || true
          echo "Installing platforms;android-35 and build-tools;35.0.0 ..."
          $SDKMANAGER --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || {
            echo "Install failed, trying with --sdk_root"
            yes | $SDKMANAGER --sdk_root=$ANDROID_HOME --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          }
          echo "SDK packages after:"
          $SDKMANAGER --list_installed 2>&1 | head -100 || true
          echo "Setup done. ANDROID_HOME=$ANDROID_HOME"
          ls -lh $ANDROID_HOME/platforms/android-35/ 2>&1 | head -20 || true
          ls -lh $ANDROID_HOME/build-tools/35.0.0/ 2>&1 | head -20 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android

      - name: Generate Gradle Wrapper if missing
        run: |
          set -e
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found -> generating with gradle wrapper"
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            ls -lh gradle/wrapper/
          else
            echo "Wrapper present:"
            ls -lh gradle/wrapper/
          fi
          chmod +x gradlew
          cat gradle/wrapper/gradle-wrapper.properties
        working-directory: android

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/settings.gradle', 'android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build Debug APK
        run: |
          set -o pipefail
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle-debug.log
          else
            gradle assembleDebug --stacktrace --info 2>&1 | tee /tmp/gradle-debug.log
          fi
        working-directory: android

      - name: Capture and publish build log (on failure)
        if: failure()
        run: |
          echo "=== Gradle debug log tail (500 lines) ==="
          tail -n 500 /tmp/gradle-debug.log || true
          echo "=== find gradle failure files ==="
          find android -type f -name "*.txt" -path "*/reports/*" 2>/dev/null | head -20 || true
          ls -R android/app/build 2>&1 | head -200 || true
          # Save full log as file in repo for fetching via GitHub API (skip CI)
          cp /tmp/gradle-debug.log ./gradle-build.log || true
          # Also create a trimmed failure snippet
          grep -A 5 -B 5 "FAILED\|error:\|Execution failed\|FAILURE\|Exception" /tmp/gradle-debug.log | head -n 300 > ./gradle-failure-snippet.log || true
          cat ./gradle-failure-snippet.log || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f gradle-build.log gradle-failure-snippet.log || true
          git commit -m "ci: gradle build log [skip ci]" || echo "no commit"
          git push origin HEAD:${{ github.ref_name }} || echo "push failed, trying with token"
          # Fallback: also try to create gist-like file via API if push fails
          if [ ! -f gradle-build.log ]; then echo "no log file"; fi

      - name: Also capture log on success for debugging
        if: always()
        run: |
          if [ -f /tmp/gradle-debug.log ]; then
            echo "::group::Gradle log tail"
            tail -n 200 /tmp/gradle-debug.log || true
            echo "::endgroup::"
          fi

      - name: Build Release APK (unsigned, CI artifact)
        continue-on-error: true
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-release.log || true
          else
            gradle assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-release.log || true
          fi
          cat /tmp/gradle-release.log | tail -n 100 || true
        working-directory: android

      - name: List APKs
        run: |
          find android/app/build/outputs -type f -name "*.apk" -o -name "*.aab" | xargs ls -lh || true
          du -sh android/app/build/outputs/apk/*/* 2>&1 | head -20 || true
        if: always()

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniBeat-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK (if built)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AniBeat-release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build reports (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
